<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — Unified Command Center</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" data-shell="sidebar"></aside>

    <div class="main">
      <div class="topbar">
        <h1>Command Center Dashboard</h1>
        <div class="topbar-right">
          <button class="icon-btn" data-shell="theme-btn" id="themeToggle">☀️</button>
        </div>
      </div>

      <div class="page">
        <div class="banner hidden" id="openCaseBanner"></div>

        <section id="overviewPage">
          <div class="row g-3 mb-4">
            <div class="col-6 col-lg-3"><div class="card stat-card h-100"><div class="stat-label">Total Reports</div><div class="stat-value" id="statTotal">0</div></div></div>
            <div class="col-6 col-lg-3"><div class="card stat-card stat-red h-100"><div class="stat-label">Open Cases</div><div class="stat-value" id="statOpen">0</div></div></div>
            <div class="col-6 col-lg-3"><div class="card stat-card h-100" style="--stat-color:var(--orange);"><div class="stat-label">Overdue 12h+</div><div class="stat-value" id="statOverdue" style="color:var(--orange);">0</div></div></div>
            <div class="col-6 col-lg-3"><div class="card stat-card stat-green h-100"><div class="stat-label">Filed Today</div><div class="stat-value" id="statToday">0</div></div></div>
          </div>
          <h3 class="form-section-title">By Township / Area</h3>
          <div class="row g-3" id="townshipBreakdown"></div>
        </section>

        <section id="historyPage" class="hidden">
          <div class="toolbar">
            <select id="filterType" class="form-select w-auto" onchange="Dashboard.renderHistory()">
              <option value="">All Types</option>
              <option value="initial">Initial</option>
              <option value="progress">Progress</option>
              <option value="information">Information</option>
            </select>
            <select id="filterStatus" class="form-select w-auto" onchange="Dashboard.renderHistory()">
              <option value="">All Status</option>
              <option value="open">Ongoing</option>
              <option value="resolved">Resolved</option>
            </select>
            <input type="text" id="filterSearch" class="form-control" style="max-width:220px;" placeholder="Search code, incident, reporter…" oninput="Dashboard.renderHistory()" />
            <div class="spacer"></div>
            <button class="btn btn-ghost" onclick="Dashboard.refresh(true)">🔄 Refresh</button>
          </div>
          <div class="card" style="padding:0;overflow:hidden;">
            <div class="table-responsive">
              <table class="report-table">
                <thead><tr>
                  <th>Code</th><th>Incident</th><th>Alert</th><th>Township</th><th>Date</th><th>Status</th><th>Actions</th>
                </tr></thead>
                <tbody id="historyBody"></tbody>
              </table>
            </div>
          </div>
        </section>
      </div>
    </div>
  </div>

  <nav class="bottom-tabs" data-shell="bottomtabs"></nav>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/formSchemas.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/pdf.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
