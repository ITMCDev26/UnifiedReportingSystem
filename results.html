<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Results — KIDZ Assembly '26</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="bunting" id="bunting"></div>
<div class="topbar">
  <div class="brand">
    <div class="logo-badge">🏆</div>
    <div class="brand-text">KIDZ ASSEMBLY <b>'26</b> — Results</div>
  </div>
  <div class="actions">
    <span class="who" id="whoami"></span>
    <button class="btn-outline btn-sm" id="backBtn">← Back</button>
  </div>
</div>

<div class="page">
  <div id="content" class="card">Loading…</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="js/api.js"></script>
<script>
requireLogin();
document.getElementById('whoami').textContent = Session.displayName;
document.getElementById('backBtn').onclick = () => {
  window.location.href = Session.role === 'admin' ? 'admin.html' : 'judge.html';
};
const bunting = document.getElementById('bunting');
for (let i = 0; i < 40; i++) bunting.appendChild(document.createElement('span'));

const params = new URLSearchParams(window.location.search);
const categoryId = params.get('categoryId');

async function load() {
  const content = document.getElementById('content');
  if (!categoryId) { content.innerHTML = `<div class="empty-state"><span class="big-emoji">🏆</span><h3>No category selected</h3></div>`; return; }
  const res = await apiCall('getResults', { categoryId });
  if (!res.ok) {
    content.className = '';
    content.innerHTML = `<div class="card empty-state"><span class="big-emoji">⏳</span><h3>${res.notReleased ? 'Results not released yet' : 'Something went wrong'}</h3><p>${escapeHtml(res.error || '')}</p></div>`;
    return;
  }
  content.className = '';
  content.innerHTML = `
    <div class="card">
      <div id="resultsCapture">
        <div class="result-header">
          <div class="ribbon-badge gold">KIDZ ASSEMBLY '26 RESULTS</div>
          <div class="cat-name display">${escapeHtml(res.categoryName)}</div>
        </div>
        ${res.ranking.map(r => `
          <div class="rank-row ${r.rank === 1 ? 'gold' : r.rank === 2 ? 'silver' : r.rank === 3 ? 'bronze' : ''}">
            <div class="rank-medal">${r.rank === 1 ? '🥇' : r.rank === 2 ? '🥈' : r.rank === 3 ? '🥉' : '🎖️'}</div>
            <div class="rank-info">
              <div class="rank-title">${escapeHtml(r.title)}</div>
              <div class="rank-name">${escapeHtml(r.contestantNames)}</div>
              <div class="rank-church">${escapeHtml(r.church)}</div>
            </div>
            <div class="rank-score">${r.average.toFixed(2)}</div>
          </div>`).join('')}
        <div class="footer-note">"Go into all the world and preach the gospel to all creation." — Mark 16:15</div>
      </div>
      <div style="text-align:center; margin-top:16px;">
        <button class="btn-secondary" id="downloadBtn">⬇️ Download as Image</button>
      </div>
    </div>`;

  document.getElementById('downloadBtn').onclick = () => {
    html2canvas(document.getElementById('resultsCapture'), { backgroundColor: '#EAF6FF', scale: 2 }).then(canvas => {
      const link = document.createElement('a');
      link.download = `KidzAssembly26-Results-${res.categoryName.replace(/\s+/g, '_')}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  };
}
load();
</script>
</body>
</html>
