<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign In — Unified Command Center</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="radar-bg" aria-hidden="true"></div>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-brand">
        <div class="brand-mark">UB</div>
        <div>
          <p class="login-title" style="margin:0;">Unified Command Center</p>
        </div>
      </div>
      <p class="login-sub">Sign in with your OPCEN credentials to file and track reports.</p>

      <div class="login-error hidden" id="loginError"></div>

      <form id="loginForm" autocomplete="off">
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required placeholder="e.g. ubea.opcen" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required placeholder="••••••••" />
        </div>
        <button type="submit" class="btn btn-primary">Sign In</button>
      </form>

      <p class="text-faint" style="font-size:11.5px;margin-top:18px;text-align:center;">
        Accounts are managed by your Super Admin. Contact your OPCEN coordinator if you can't sign in.
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/theme.js"></script>
</body>
</html>
