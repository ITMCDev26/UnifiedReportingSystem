<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIDZ Assembly '26 — Judge Login</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="bunting" id="bunting"></div>

<div class="login-wrap">
  <div class="login-card">
    <div class="ribbon-badge gold">KIDZ ASSEMBLY '26</div>
    <h1 class="display">CALLED TO<br><span class="go">GO ➔</span></h1>
    <div class="verse">READY, SET, GO WITH JESUS! — MARK 16:15</div>

    <form id="loginForm">
      <div class="field" style="text-align:left">
        <label for="username">Username</label>
        <input id="username" autocomplete="username" required>
      </div>
      <div class="field" style="text-align:left">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required>
      </div>
      <div id="msg"></div>
      <button type="submit" class="btn-primary btn-block" id="loginBtn">Log In</button>
    </form>
    <div class="role-note">Judges &amp; admins use the same login screen — you'll be sent to the right dashboard automatically.</div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  // paint bunting flags
  const bunting = document.getElementById('bunting');
  for (let i = 0; i < 40; i++) bunting.appendChild(document.createElement('span'));

  // if already logged in, skip straight to dashboard
  if (Session.isLoggedIn()) {
    window.location.href = Session.role === 'admin' ? 'admin.html' : 'judge.html';
  }

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const msg = document.getElementById('msg');
    msg.innerHTML = '';
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Logging in…';
    try {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const data = await apiCall('login', { username, password });
      if (!data.ok) {
        msg.innerHTML = `<div class="error-msg">${escapeHtml(data.error || 'Login failed.')}</div>`;
      } else {
        Session.save(data);
        window.location.href = data.role === 'admin' ? 'admin.html' : 'judge.html';
      }
    } catch (err) {
      msg.innerHTML = `<div class="error-msg">${escapeHtml(err.message)}</div>`;
    } finally {
      btn.disabled = false;
      btn.textContent = 'Log In';
    }
  });
</script>
</body>
</html>
